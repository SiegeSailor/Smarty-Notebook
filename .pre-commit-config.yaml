repos:
  # - repo: https://github.com/opensource-nepal/commitlint
  #   rev: v1.3.0
  #   hooks:
  #     - id: commitlint
  - repo: local
    hooks:
      - id: semantic-release-check
        name: semantic-release version check
        entry: bash -c 'if command -v semantic-release &> /dev/null; then semantic-release --config "./releaserc.toml" --noop version --print; else echo "semantic-release not found, skipping..."; fi'
        language: system
        stages: [pre-commit]
        pass_filenames: false
        always_run: true
