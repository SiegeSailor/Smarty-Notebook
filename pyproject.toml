[project]
name = "smarty-notebook"
version = "1.0.0"
description = "A Jupyter notebook collection for executing Smarty requests. The notebook provides easy-to-use cells and batch configurations."
authors = [
    { name = "JinYu.Zhang", email = "JinYu.Zhang@coopersurgical.com" }
]
readme = "./README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy==2.3.3",
    "pandas==2.3.2",
    "python-dotenv==1.2.1",
    "requests==2.32.5"
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
package-mode = false
